name: Build Fox AI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart run tool/setup.dart
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: FoxAI-android
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Выложить APK в Releases
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk FoxAI.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FoxAI.apk --target "$GITHUB_SHA" \
            --title "Fox AI (последняя сборка)" \
            --notes "Скачайте FoxAI.apk и установите на Android."
        env:
          GH_TOKEN: ${{ github.token }}

  windows:
    name: Windows (EXE)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart run tool/setup.dart
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: FoxAI-windows
          path: build/windows/x64/runner/Release/

  ios:
    name: iOS (без подписи)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart run tool/setup.dart
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Упаковать в .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr FoxAI-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FoxAI-ios-unsigned
          path: FoxAI-unsigned.ipa
